# Builds the Runpod worker image on a version tag and pushes it to GHCR.
# One manual step after the first push: set the package visibility to Public
# (GitHub profile > Packages > dnd-music-generator > Package settings), so Runpod can pull it.
name: runpod-image
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dnd-music-generator" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/generator.Dockerfile
          target: runpod
          platforms: linux/amd64
          push: true
          tags: ${{ steps.img.outputs.name }}:${{ github.ref_name }}
