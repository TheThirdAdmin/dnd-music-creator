[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dndmusic"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "numpy>=2.0",
  "pyyaml>=6.0",
  "pychromecast>=14.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "soundfile>=0.12", "pillow>=10"]
art = ["pillow>=10", "pyyaml", "httpx"]

[tool.hatch.build.targets.wheel]
packages = ["dndmusic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-m 'not gpu'"
markers = [
  "e2e: starts real servers and ffmpeg (slower)",
  "gpu: needs a running real generator at GENERATOR_URL; opt in with -m gpu",
]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
